name: Actualizar Agenda Deportiva

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: update-agenda-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: /home/runner/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v2-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-v2-

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar navegador Playwright (solo si falta)
        env:
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
        run: |
          if [ -d "/home/runner/.cache/ms-playwright" ] && [ -n "$(ls -A /home/runner/.cache/ms-playwright 2>/dev/null)" ]; then
            echo "Navegador Playwright ya encontrado en caché. Omitiendo instalación."
          else
            echo "Navegador no encontrado o caché vacía. Instalando Chromium..."
            playwright install chromium
          fi

      - name: Ejecutar script de actualización
        run: |
          python generate_agenda.py

      - name: Commit y push de cambios
        run: |
          git add index.html channels.json
          if git diff --staged --quiet; then
            echo "No hay cambios en los ficheros, se omite el commit."
          else
            git commit -m "Actualización automática de agenda y canales CDN"
            git push
          fi
