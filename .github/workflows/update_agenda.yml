name: Actualizar Agenda Deportiva

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: update-agenda-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Ejecutar script de actualización
        run: |
          python generate_agenda.py

      - name: Commit y push de cambios
        run: |
          git add index.html channels.json
          if git diff --staged --quiet; then
            echo "No hay cambios en los ficheros, se omite el commit."
          else
            git commit -m "Actualización automática de agenda y canales CDN"
            git push
          fi
